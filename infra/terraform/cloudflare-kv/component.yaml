apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: cloudflare-kv
  description: Provisions Cloudflare KV namespaces backing the api-edge idempotency replay store (stage and prod)
  labels:
    domain: infra
    scope: edge-idempotency-replay-store

spec:
  type: terraform
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest declares
  # (tooling/catalog/gen-component-docs.mjs).
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: infra

  parameters:
    orgName: sourceplane
    stackName: cloudflare-kv
    terraformDir: terraform
    terraformVersion: "1.15.3"
    # SEC-JOB: the wiring document (KV namespace id/title) is lease-published
    # post-apply; api-edge deploys read it back as WIRING_CLOUDFLARE_KV_<ENV>.
    secretOutputs: "WIRING_CLOUDFLARE_KV=wiring"

  # The Cloudflare Terraform provider authenticates via the CLOUDFLARE_API_TOKEN
  # env var, resolved by orun from the project-rung brokered secret (fresh per
  # run, Deploy Workers scope). Declared at component level because plan-only
  # lanes refresh against the live Cloudflare API too, not just apply.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://org_d830a4d1b68a41e6a36c843d69185eec/cloudflare-only-saas/{{ .environment }}/CLOUDFLARE_API_TOKEN"
    # Non-secret connection fact (account-id template) — replaces the ambient
    # CLOUDFLARE_ACCOUNT_ID / TF_VAR_cloudflare_account_id CI values.
    CLOUDFLARE_ACCOUNT_ID: "secret://org_d830a4d1b68a41e6a36c843d69185eec/cloudflare-only-saas/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_cloudflare_account_id: "secret://org_d830a4d1b68a41e6a36c843d69185eec/cloudflare-only-saas/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"

  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
