apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: db-migrate
  description: Applies database migrations to the stage and prod Cloudflare D1 databases
  labels:
    domain: infra
    scope: database
    team: platform
    layer: data

spec:
  type: db-migrate
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest declares
  # (tooling/catalog/gen-component-docs.mjs).
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: infra

  dependsOn:
    - component: db
    # Migrations target the database the `cloudflare-d1` component creates, and
    # find it through the wiring document that component lease-publishes
    # post-apply.
    - component: cloudflare-d1

  path: packages/db/src/migrations

  parameters:
    nodeVersion: "20"
    pnpmVersion: "10.12.1"
    owner: sourceplane
    repo: cloudflare-only-saas

  # Everything the runner needs to reach D1 over the REST API, all resolved
  # from orun secrets: the provider credential is minted fresh per run from the
  # Cloudflare integration's d1-edit template, the account id is a non-secret
  # connection fact, and the database id arrives in the wiring document the
  # cloudflare-d1 component lease-publishes.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://org_d830a4d1b68a41e6a36c843d69185eec/cloudflare-only-saas/{{ .environment }}/CLOUDFLARE_D1_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "secret://org_d830a4d1b68a41e6a36c843d69185eec/cloudflare-only-saas/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    WIRING_CLOUDFLARE_D1: "secret://org_d830a4d1b68a41e6a36c843d69185eec/cloudflare-only-saas/{{ .environment }}/WIRING_CLOUDFLARE_D1"

  subscribe:
    environments:
      - name: stage
        # A pull request deploys nothing, so nothing on one waits; a merge
        # keeps the ordering (migrations, infrastructure, the edge).
        dependencyRules:
          - mode: advisory
            when:
              triggerRef: github-pull-request
        profile: plan
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        # A pull request deploys nothing, so nothing on one waits; a merge
        # keeps the ordering (migrations, infrastructure, the edge).
        dependencyRules:
          - mode: advisory
            when:
              triggerRef: github-pull-request
        profile: plan
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
